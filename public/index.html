<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UV PDF test</title>
  <link rel="stylesheet" href="uv/uv.css" />
  <script src="uv/umd/UV.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    #uv { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="uv" class="uv"></div>
  <script>
    // ?pdfjs=1 -> pdf.js canvas renderer, default -> browser-native (PDFObject)
    // Manifest defaults to /manifest.json, override with #?manifest=...
    // ?pdfjs=new -> pdf.js canvas renderer using newer pdf.js (version in ?v=, default below)
    const params = new URLSearchParams(location.search);
    const usePdfJs = params.get("pdfjs") === "1" || params.get("pdfjs") === "new";
    if (params.get("pdfjs") === "new") {
      window.PDFJS_ESM_BASE = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${params.get("v") || "6.5.438"}/build/`;
    }
    // manifest.json is written for http://localhost:8080; rewrite it to the current origin
    // so the same page works locally and when deployed.
    const manifestReady = location.hash.includes("manifest=")
      ? Promise.resolve()
      : fetch("manifest.json")
          .then((r) => r.text())
          .then((t) => {
            const blob = new Blob([t.replaceAll("http://localhost:8080", location.origin)], { type: "application/json" });
            location.hash = "?manifest=" + URL.createObjectURL(blob);
          });
    document.addEventListener("DOMContentLoaded", async () => {
      await manifestReady;
      const urlAdapter = new UV.IIIFURLAdapter();
      const data = urlAdapter.getInitialData({ embedded: false });
      const uv = UV.init("uv", data);
      urlAdapter.bindTo(uv);
      uv.on("configure", ({ config, cb }) => {
        cb(new Promise((resolve) => {
          resolve({ modules: { pdfCenterPanel: { options: { usePdfJs } } } });
        }));
      });
    });
  </script>
</body>
</html>
